<html lang="en">
  <head>

<!-- Open Graph / Facebook / Messenger -->

    <meta property="og:image" content="https://cat-has.github.io/ScalprX/og-image.png" />

    <!-- Twitter / X -->

    <script>
      try {
        var s = JSON.parse(localStorage.getItem('scalprx.settings.v1') || '{}');
        var t = s.theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ScalprX needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
