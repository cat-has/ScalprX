<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="ScalprX - precision for every trade. Local-first crypto scalping analytics, risk calculator and trade journal." />
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>ScalprX - Precision for every trade</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('scalprx.settings.v1') || '{}');
        var t = s.theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ScalprX needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
